# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ── Daemon / memory ──────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache. If a Hilt/KSP sync ever fails with a confusing
# "configuration cache problems" report, flip this to false to isolate whether
# the cache is the cause before chasing the error itself.
org.gradle.configuration-cache=true

# ── AndroidX ─────────────────────────────────────────────────────────────────
# Required. Without useAndroidX the build fails as soon as any androidx
# artifact is on the classpath.
android.useAndroidX=true

# R classes contain only this module's resources, not those of its
# dependencies. Smaller R classes, faster incremental builds.
android.nonTransitiveRClass=true

# ── Kotlin ───────────────────────────────────────────────────────────────────
kotlin.code.style=official
