# ─────────────────────────────────────────────────────────────────────────────
# Version catalog — Kotlin Multiplatform
#
#   AGP 9.2.1 / Gradle 9.4.1 / JDK 17 / Kotlin 2.3.21
#   Compose Multiplatform 1.10.3 — the release JetBrains documents as AGP 9
#   compatible. The androidx.* companions below are the JetBrains-published
#   multiplatform forks (org.jetbrains.androidx.*), NOT the Google artifacts.
#
# Under AGP 9 the KMP plugin cannot coexist with com.android.application or
# com.android.library. The shared module therefore uses
# com.android.kotlin.multiplatform.library with an androidLibrary {} block, and
# the Android entry point lives in its own :androidApp module.
# ─────────────────────────────────────────────────────────────────────────────

[versions]
agp                  = "9.2.1"
kotlin               = "2.3.21"
compose-multiplatform = "1.10.3"

lifecycle-mp         = "2.10.0"
navigation-mp        = "2.9.2"
savedstate-mp        = "1.4.0"
datastore            = "1.1.1"
koin                 = "4.1.0"
activity-compose     = "1.9.3"
coroutines           = "1.9.0"
okio                 = "3.9.1"
serialization-json   = "1.7.3"

compileSdk           = "36"
minSdk               = "24"

[libraries]
# ── Multiplatform AndroidX (JetBrains forks) ─────────────────────────────────
lifecycle-viewmodel-compose = { group = "org.jetbrains.androidx.lifecycle",  name = "lifecycle-viewmodel-compose", version.ref = "lifecycle-mp" }
lifecycle-runtime-compose   = { group = "org.jetbrains.androidx.lifecycle",  name = "lifecycle-runtime-compose",   version.ref = "lifecycle-mp" }
navigation-compose          = { group = "org.jetbrains.androidx.navigation", name = "navigation-compose",          version.ref = "navigation-mp" }
savedstate                  = { group = "org.jetbrains.androidx.savedstate", name = "savedstate",                  version.ref = "savedstate-mp" }

# ── DataStore (multiplatform since 1.1) ──────────────────────────────────────
datastore-preferences       = { group = "androidx.datastore", name = "datastore-preferences-core", version.ref = "datastore" }

okio                        = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }

# ── DI — Koin replaces Hilt, which is Android-only ───────────────────────────
koin-core                   = { group = "io.insert-koin", name = "koin-core",             version.ref = "koin" }
koin-compose                = { group = "io.insert-koin", name = "koin-compose",          version.ref = "koin" }
koin-compose-viewmodel      = { group = "io.insert-koin", name = "koin-compose-viewmodel", version.ref = "koin" }
koin-android                = { group = "io.insert-koin", name = "koin-android",          version.ref = "koin" }

# ── Android entry point only ─────────────────────────────────────────────────
androidx-activity-compose    = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }

# ── Kotlinx ──────────────────────────────────────────────────────────────────
kotlinx-coroutines-core     = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing    = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-test     = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json  = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization-json" }

[plugins]
android-application        = { id = "com.android.application",                        version.ref = "agp" }
android-kmp-library        = { id = "com.android.kotlin.multiplatform.library",       version.ref = "agp" }
kotlin-multiplatform       = { id = "org.jetbrains.kotlin.multiplatform",             version.ref = "kotlin" }
kotlin-compose             = { id = "org.jetbrains.kotlin.plugin.compose",            version.ref = "kotlin" }
kotlin-serialization       = { id = "org.jetbrains.kotlin.plugin.serialization",      version.ref = "kotlin" }
compose-multiplatform      = { id = "org.jetbrains.compose",                          version.ref = "compose-multiplatform" }
